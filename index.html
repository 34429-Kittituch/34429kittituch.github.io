<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>หน้าแนะนำตัวของผม</title>

  <style>
    body {
      background-color: #6699FF;
      color: #333;
      text-align: center;
      padding: 50px;
      font-family: sans-serif;
    }

    .card {
      background: white;
      border-radius: 30px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      max-width: 500px;
      margin: 0 auto;
      padding: 30px;
    }

    h1 {
      color: #2c3e50;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
    }

    .btn {
      display: inline-block;
      background-color: #3498db;
      color: white;
      padding: 12px 20px;
      text-decoration: none;
      border-radius: 8px;
      margin-top: 15px;
    }

    .btn:hover {
      background-color: #217dbb;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>ยินดีต้อนรับสู่โปรไฟล์ของผม 👋</h1>

    <p>
      สวัสดีครับ! ผมชื่อ
      <strong>กิตติธัช เพชรประไพ</strong>
    </p>

    <p>
      ขณะนี้กำลังศึกษาในด้าน
      <strong>Engineering</strong>
      และสนใจด้าน
      <strong>Pharmacy</strong>
    </p>

    <p>
      นี่คือเว็บไซต์แรกของผมที่โฮสต์บน GitHub Pages! 🚀
    </p>

    <!-- ปุ่มไปหน้า Portfolio -->
    <a href="portfolio.html" class="btn">
      📁 ดูแฟ้มสะสมงานของผม
    </a>

  </div>

</body>
</html>
